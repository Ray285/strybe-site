<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title == site.title %}{{ site.title }}{% if site.tagline %} — {{ site.tagline }}{% endif %}{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ site.title }}{% if site.tagline %} — {{ site.tagline }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  {% comment %} Restore once Strybe has a real icon at assets/images/icon.png:
  <link rel="icon" href="{{ '/assets/images/icon.png' | relative_url }}"> {% endcomment %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% if page.animate %}
  <!-- Hide what the entrance animation reveals, before first paint. site.js
       shows it again if motion is reduced or GSAP fails to load, and the
       timer does if site.js never runs at all. -->
  <script>
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("js");
      window.revealFallback = setTimeout(function () { document.documentElement.classList.remove("js"); }, 4000);
    }
  </script>
{% endif %}
</head>
<body class="{{ page.body_class | default: 'page-legal' }}">
{{ content }}
{% if page.animate %}
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
{% endif %}
</body>
</html>
