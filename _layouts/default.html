<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title == site.title %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --rule: #e6e6e6;
      --accent: #c9531f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --text: #f2f2f2;
        --muted: #9a9a9a;
        --rule: #2a2a2a;
        --accent: #ec662b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 48px; }
    header { margin-bottom: 32px; }
    header a { color: var(--text); font-weight: 700; text-decoration: none; letter-spacing: 0.02em; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
    h2 { font-size: 1.15rem; margin: 32px 0 8px; }
    a { color: var(--accent); }
    em { color: var(--muted); }
    ul { padding-left: 1.2em; }
    footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.875rem;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    {% unless page.url == "/" %}<header><a href="{{ '/' | relative_url }}">Strybe</a></header>{% endunless %}
    <main>
      {{ content }}
    </main>
    <footer>
      © {{ 'now' | date: '%Y' }} Big Lemon LLC ·
      <a href="{{ '/privacy' | relative_url }}">Privacy</a> ·
      <a href="{{ '/terms' | relative_url }}">Terms</a>
    </footer>
  </div>
</body>
</html>
